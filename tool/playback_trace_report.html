<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jive 播放启动日志分析</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f6f4ef, #0b0d10);
      --surface: light-dark(#ffffff, #13171c);
      --elevated: light-dark(#ece8df, #1b2027);
      --text: light-dark(#1a1c1e, #f5f7fa);
      --muted: light-dark(#62676d, #a8b0ba);
      --border: light-dark(#d8d1c5, #252b33);
      --accent: light-dark(#9a6400, #f2b84b);
      --accent-soft: light-dark(#f8e8c2, #3b2d13);
      --green: light-dark(#237a3b, #63c174);
      --red: light-dark(#b3261e, #f06a6a);
      --blue: light-dark(#245ea8, #67a5f7);
      --shadow: 0 12px 34px light-dark(#332a1b14, #00000045);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; }
    button, .file-label { cursor: pointer; }
    .shell { max-width: 1380px; margin: 0 auto; padding: 28px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: 28px; margin-bottom: 5px; }
    h2 { font-size: 18px; margin-bottom: 14px; }
    h3 { font-size: 15px; margin-bottom: 8px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }
    .import-card { padding: 18px; margin-bottom: 22px; }
    .import-row { display: grid; grid-template-columns: minmax(260px, 1fr) auto; gap: 14px; align-items: stretch; }
    .drop-zone {
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 20px;
      transition: border-color .15s, background .15s;
    }
    .drop-zone.dragging { border-color: var(--accent); background: var(--accent-soft); }
    .actions { display: flex; flex-direction: column; gap: 9px; min-width: 160px; }
    .button, .file-label {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      background: var(--elevated);
      text-align: center;
      text-decoration: none;
    }
    .button.primary, .file-label.primary { background: var(--accent); color: light-dark(#fff, #17120a); border-color: transparent; }
    .button:focus-visible, .file-label:focus-within, select:focus-visible, textarea:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent), transparent 55%); outline-offset: 2px; }
    input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
    textarea {
      width: 100%;
      min-height: 120px;
      margin-top: 14px;
      padding: 12px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
    }
    .error { color: var(--red); margin-top: 10px; }
    .workspace { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
    .sidebar { padding: 12px; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
    .sidebar-head { padding: 6px 7px 10px; display: flex; align-items: center; justify-content: space-between; }
    .count { color: var(--muted); font-variant-numeric: tabular-nums; }
    .log-item {
      display: block;
      width: 100%;
      padding: 11px;
      margin: 0 0 6px;
      border: 1px solid transparent;
      border-radius: 10px;
      color: var(--text);
      background: transparent;
      text-align: left;
    }
    .log-item:hover { background: var(--elevated); }
    .log-item.active { background: var(--accent-soft); border-color: var(--accent); }
    .log-title { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .log-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .status { font-weight: 600; }
    .status.success { color: var(--green); }
    .status.failed, .status.cancelled { color: var(--red); }
    .main { min-width: 0; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
    }
    .tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
    .panel { display: none; }
    .panel.active { display: block; }
    .hero { padding: 20px; margin-bottom: 16px; }
    .hero-top { display: flex; justify-content: space-between; gap: 18px; align-items: start; }
    .hero h2 { font-size: 22px; margin-bottom: 4px; }
    .badge { display: inline-flex; padding: 4px 9px; border-radius: 999px; background: var(--elevated); font-size: 12px; font-weight: 600; }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
    .metric { padding: 12px; background: var(--elevated); border-radius: 10px; }
    .metric-label { display: block; color: var(--muted); font-size: 12px; }
    .metric-value { display: block; margin-top: 3px; font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .chart-card, .io-card, .raw-card, .compare-card { padding: 20px; margin-bottom: 16px; }
    .stage-row { display: grid; grid-template-columns: minmax(150px, 230px) minmax(160px, 1fr) 86px 72px; gap: 12px; align-items: center; margin: 11px 0; }
    .stage-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track { height: 11px; background: var(--elevated); border-radius: 999px; overflow: hidden; }
    .bar { height: 100%; min-width: 2px; border-radius: inherit; background: var(--accent); }
    .stage-row.failed .bar { background: var(--red); }
    .number { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .percent { color: var(--muted); }
    details summary { cursor: pointer; color: var(--muted); }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border-radius: 10px; padding: 12px; max-height: 420px; overflow: auto; }
    .compare-controls { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; margin-bottom: 18px; }
    label { display: block; color: var(--muted); font-size: 12px; }
    select { width: 100%; margin-top: 5px; padding: 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); color: var(--text); }
    .arrow { padding-bottom: 9px; color: var(--muted); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 650px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-size: 12px; font-weight: 600; }
    .delta.faster { color: var(--green); font-weight: 650; }
    .delta.slower { color: var(--red); font-weight: 650; }
    .empty { padding: 54px 24px; text-align: center; color: var(--muted); }
    @media (max-width: 850px) {
      .shell { padding: 16px; }
      .workspace { grid-template-columns: 1fr; }
      .sidebar { position: static; max-height: 260px; }
      .metrics { grid-template-columns: 1fr; }
      .stage-row { grid-template-columns: minmax(120px, 1fr) 90px; }
      .track { grid-column: 1 / -1; grid-row: 2; }
      .percent { display: none; }
    }
    @media (max-width: 540px) {
      header, .hero-top { flex-direction: column; align-items: stretch; }
      .import-row, .compare-controls { grid-template-columns: 1fr; }
      .arrow { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>播放启动日志分析</h1>
        <p class="muted">所有解析均在本地浏览器完成，不上传日志。</p>
      </div>
      <div class="small muted">支持 JIVE JSON、JSONL 和 CHUNK 分片日志</div>
    </header>

    <section class="card import-card" aria-labelledby="import-title">
      <h2 id="import-title">导入日志</h2>
      <div class="import-row">
        <div id="drop-zone" class="drop-zone">
          <div><strong>拖入 playback_trace.log</strong><br><span class="muted small">或使用右侧文件选择，也可在下方粘贴内容</span></div>
        </div>
        <div class="actions">
          <label class="file-label primary">选择日志文件<input id="file-input" type="file" accept=".log,.txt,.json,.jsonl" multiple></label>
          <button id="parse-text" class="button" type="button">解析粘贴内容</button>
          <button id="clear-all" class="button" type="button">清空</button>
        </div>
      </div>
      <textarea id="paste-input" placeholder="粘贴 JIVE_PLAYBACK_TRACE_CHUNK 或完整 JSON…" aria-label="粘贴日志内容"></textarea>
      <div id="import-error" class="error small" role="alert"></div>
    </section>

    <section id="empty-state" class="card empty">导入日志后查看每次启动的阶段耗时和任意两次对比。</section>

    <section id="workspace" class="workspace" hidden>
      <aside class="card sidebar" aria-label="日志列表">
        <div class="sidebar-head"><strong>启动记录</strong><span id="log-count" class="count"></span></div>
        <div id="log-list"></div>
      </aside>

      <div class="main">
        <nav class="tabs" aria-label="报告视图">
          <button class="tab active" type="button" data-tab="detail">日志详情</button>
          <button class="tab" type="button" data-tab="compare">对比分析</button>
        </nav>

        <section id="detail-panel" class="panel active">
          <div id="detail-content"></div>
        </section>

        <section id="compare-panel" class="panel">
          <div class="card compare-card">
            <h2>选择两次启动记录</h2>
            <div class="compare-controls">
              <label>基准记录<select id="compare-before"></select></label>
              <div class="arrow">→</div>
              <label>对比记录<select id="compare-after"></select></label>
            </div>
            <div id="compare-content"></div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const labels = {
        startupTotal: '启动总耗时',
        downloadSelectionLookup: '下载选集查询',
        detailResolvePlayback: '详情播放信息解析',
        favoriteSnapshotRefresh: '收藏快照更新',
        playerRoutePush: '播放器页面打开',
        skipPolicyLoad: '跳片头策略加载',
        unknownCachePrecheck: '未知格式提前探测',
        playbackSourceResolve: '真实播放地址解析',
        contentTypeSniff: '媒体格式探测',
        hlsSessionPrepare: 'HLS 清单与会话构建',
        proxyServerStart: '本地代理启动',
        cacheManagerLoad: '缓存管理器就绪',
        sessionCacheLookup: '完整缓存查询',
        hlsManifestFetch: 'HLS 清单网络请求',
        hlsManifestParse: 'HLS 清单解析',
        hlsAdFilter: 'HLS 广告过滤',
        hlsProxyPlan: '代理清单改写',
        sessionCacheEntry: '缓存条目初始化',
        sessionCachePersist: '清单与时间轴落盘',
        sessionCacheAcquire: '缓存引用获取',
        proxyFallbackCleanup: '失败播放资源释放',
        controllerInitializeProxy: '代理播放器初始化',
        controllerInitializeDirect: '直连播放器初始化',
        controllerConfigure: '播放器配置总计',
        resumeSeek: '恢复续播位置',
        controllerSetSpeed: '设置播放速度',
        controllerSetVolume: '设置播放音量',
        controllerPlay: '启动播放'
      };

      let reports = [];
      let selectedId = null;

      const $ = id => document.getElementById(id);
      const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      const formatMs = value => {
        const ms = Number(value || 0);
        return ms >= 1000 ? `${(ms / 1000).toFixed(2)}s` : `${ms >= 100 ? ms.toFixed(0) : ms.toFixed(1)}ms`;
      };
      const formatOptionalMs = value => Number.isFinite(Number(value)) ? formatMs(value) : '—';
      const formatBytes = value => {
        const bytes = Number(value);
        if (!Number.isFinite(bytes)) return '—';
        if (bytes >= 1048576) return `${(bytes / 1048576).toFixed(1)} MB`;
        if (bytes >= 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${bytes} B`;
      };
      const stageLabel = name => labels[name] || name;

      function normalize(value) {
        if (!value || typeof value !== 'object' || value.tag !== 'JIVE_PLAYBACK_TRACE') return null;
        const stages = Array.isArray(value.stages) ? value.stages
          .filter(stage => stage && typeof stage.name === 'string' && Number.isFinite(Number(stage.durationMs)))
          .map(stage => ({name: stage.name, parent: stage.parent, durationMs: Number(stage.durationMs), result: String(stage.result || 'unknown')})) : [];
        return {
          traceId: String(value.traceId || `unknown-${reports.length}`),
          result: String(value.result || 'unknown'),
          totalStartupMs: Number(value.totalStartupMs || 0),
          videoTitle: String(value.video?.title || '未知视频'),
          sourceId: String(value.video?.sourceId || ''),
          sourceVideoId: String(value.video?.sourceVideoId || ''),
          episodeName: String(value.episode?.name || '未知剧集'),
          episodeId: String(value.episode?.id || ''),
          format: String(value.playback?.format || 'unknown'),
          mode: String(value.playback?.mode || 'unknown'),
          usedProxy: value.playback?.usedProxy,
          stages,
          startupIo: value.startupIo && typeof value.startupIo === 'object' ? value.startupIo : null,
          raw: value
        };
      }

      function decodeBase64Utf8(value) {
        const binary = atob(value);
        const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      }

      function parseText(text) {
        const found = [];
        const trimmed = text.trim();
        if (!trimmed) return found;

        try {
          const decoded = JSON.parse(trimmed);
          const values = Array.isArray(decoded) ? decoded : [decoded];
          values.forEach(value => { const report = normalize(value); if (report) found.push(report); });
          if (found.length) return found;
        } catch (_) {}

        const chunkPattern = /JIVE_PLAYBACK_TRACE_CHUNK\s+(\S+)\s+(\d+)\/(\d+)\s+([A-Za-z0-9+/=]+)/g;
        const grouped = new Map();
        let match;
        while ((match = chunkPattern.exec(text)) !== null) {
          const [, id, indexRaw, totalRaw, payload] = match;
          if (!grouped.has(id)) grouped.set(id, {total: Number(totalRaw), chunks: new Map()});
          grouped.get(id).chunks.set(Number(indexRaw), payload);
        }
        grouped.forEach(group => {
          if (group.chunks.size !== group.total) return;
          try {
            let payload = '';
            for (let index = 1; index <= group.total; index++) payload += group.chunks.get(index) || '';
            const report = normalize(JSON.parse(decodeBase64Utf8(payload)));
            if (report) found.push(report);
          } catch (_) {}
        });

        for (const rawLine of text.split(/\r?\n/)) {
          const start = rawLine.indexOf('{');
          if (start < 0) continue;
          try {
            const report = normalize(JSON.parse(rawLine.slice(start)));
            if (report) found.push(report);
          } catch (_) {}
        }
        return found;
      }

      function addReports(next) {
        const byId = new Map(reports.map(report => [report.traceId, report]));
        next.forEach(report => byId.set(report.traceId, report));
        reports = [...byId.values()];
        if (!selectedId && reports.length) selectedId = reports[0].traceId;
        render();
      }

      function stageMap(report) {
        const map = new Map();
        report.stages.forEach(stage => map.set(stage.name, (map.get(stage.name) || 0) + stage.durationMs));
        return map;
      }

      function independentStages(report) {
        return [...report.stages].sort((a, b) => b.durationMs - a.durationMs);
      }

      function reportName(report) {
        return `${report.videoTitle} · ${report.episodeName}`;
      }

      function renderStartupIo(report) {
        const startupIo = report.startupIo;
        if (!startupIo) return '';
        const manifest = startupIo.proxyManifest;
        const resources = Array.isArray(startupIo.resources) ? startupIo.resources : [];
        const rows = resources.map(resource => {
          const lookup = resource.cacheLookup || {};
          const headers = resource.upstreamHeaders || {};
          const firstByte = resource.upstreamFirstByte || {};
          const download = resource.downloadComplete || {};
          const reserve = resource.cacheReserve || {};
          const setup = resource.fileSetup || {};
          const commit = resource.cacheCommit || {};
          const downstream = resource.downstreamFirstByte || {};
          const complete = resource.downstreamComplete || {};
          const cache = lookup.hit === true ? '命中' : lookup.hit === false ? '未命中' : '—';
          return `<tr>
            <td>#${escapeHtml(resource.index)} ${escapeHtml(resource.type || 'resource')}<div class="muted small">${escapeHtml(resource.method || '')} ${escapeHtml(resource.ext || '')}</div></td>
            <td>${resource.range ? escapeHtml(resource.range) : '—'}</td>
            <td>${cache}<div class="muted small">${formatOptionalMs(lookup.durationMs)}</div></td>
            <td>${formatOptionalMs(headers.durationMs)}<div class="muted small">HTTP ${escapeHtml(headers.statusCode ?? '—')}</div></td>
            <td>${formatOptionalMs(firstByte.elapsedMs)}</td>
            <td>${formatOptionalMs(download.durationMs)}<div class="muted small">${formatBytes(download.bytes)}</div></td>
            <td>${reserve.granted == null ? '—' : reserve.granted ? '成功' : '失败'}<div class="muted small">${formatOptionalMs(reserve.durationMs)}</div></td>
            <td>${formatOptionalMs(setup.durationMs)}</td>
            <td>${escapeHtml(commit.result || '—')}<div class="muted small">${formatOptionalMs(commit.durationMs)}</div></td>
            <td>${formatOptionalMs(downstream.elapsedMs)}</td>
            <td>${formatOptionalMs(complete.durationMs)}<div class="muted small">${formatBytes(complete.bytes)}</div></td>
          </tr>`;
        }).join('');
        const manifestText = manifest
          ? `本地清单：收到于 ${formatOptionalMs(manifest.receivedAtMs)}，响应 ${formatOptionalMs(manifest.durationMs)}`
          : '没有代理清单采样';
        return `<section class="card io-card"><h2>启动期代理 / 缓存细分</h2><p class="muted small">${manifestText}；最多采样前三个资源，缺失项表示播放完成时事件尚未发生。</p>
          ${rows ? `<div class="table-wrap"><table><thead><tr><th>资源</th><th>Range</th><th>缓存查询</th><th>响应头</th><th>源站首字节</th><th>下载完成</th><th>Reserve</th><th>文件准备</th><th>Commit</th><th>下游首字节</th><th>下游完成</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<p class="muted">没有启动资源数据</p>'}
        </section>`;
      }

      function renderList() {
        $('log-count').textContent = `${reports.length} 条`;
        $('log-list').innerHTML = reports.map((report, index) => `
          <button class="log-item ${report.traceId === selectedId ? 'active' : ''}" type="button" data-id="${escapeHtml(report.traceId)}">
            <span class="log-title">${index + 1}. ${escapeHtml(reportName(report))}</span>
            <span class="log-meta"><span class="status ${escapeHtml(report.result)}">${escapeHtml(report.result)}</span><span>${formatMs(report.totalStartupMs)}</span></span>
          </button>`).join('');
        document.querySelectorAll('.log-item').forEach(button => button.addEventListener('click', () => {
          selectedId = button.dataset.id;
          renderList();
          renderDetail();
        }));
      }

      function renderDetail() {
        const report = reports.find(item => item.traceId === selectedId) || reports[0];
        if (!report) return;
        const ranking = independentStages(report);
        const max = Math.max(1, ...ranking.map(stage => stage.durationMs));
        const slowest = ranking[0];
        const rows = ranking.map(stage => {
          const percentTotal = report.totalStartupMs ? stage.durationMs / report.totalStartupMs * 100 : 0;
          return `<div class="stage-row ${stage.result === 'failed' || stage.result === 'cancelled' ? 'failed' : ''}">
            <div class="stage-name" title="${escapeHtml(stage.name)}">${stage.parent ? '↳ ' : ''}${escapeHtml(stageLabel(stage.name))}</div>
            <div class="track"><div class="bar" style="width:${Math.max(0.4, stage.durationMs / max * 100).toFixed(2)}%"></div></div>
            <div class="number">${formatMs(stage.durationMs)}</div>
            <div class="number percent">${percentTotal.toFixed(1)}%</div>
          </div>`;
        }).join('');
        $('detail-content').innerHTML = `
          <section class="card hero">
            <div class="hero-top"><div><h2>${escapeHtml(reportName(report))}</h2><div class="muted small">${escapeHtml([report.sourceId, report.format, report.mode].filter(Boolean).join(' · '))}</div></div><span class="badge status ${escapeHtml(report.result)}">${escapeHtml(report.result)}</span></div>
            <div class="metrics">
              <div class="metric"><span class="metric-label">启动总耗时</span><span class="metric-value">${formatMs(report.totalStartupMs)}</span></div>
              <div class="metric"><span class="metric-label">最慢阶段</span><span class="metric-value">${escapeHtml(slowest ? stageLabel(slowest.name) : '—')}</span></div>
              <div class="metric"><span class="metric-label">最慢阶段耗时</span><span class="metric-value">${slowest ? formatMs(slowest.durationMs) : '—'}</span></div>
            </div>
          </section>
          <section class="card chart-card"><h2>阶段耗时排行</h2><p class="muted small">↳ 子阶段已包含在父阶段中，耗时不能重复相加。</p>${rows || '<p class="muted">没有阶段数据</p>'}</section>
          ${renderStartupIo(report)}
          <section class="card raw-card"><details><summary>查看原始 JSON</summary><pre>${escapeHtml(JSON.stringify(report.raw, null, 2))}</pre></details></section>`;
      }

      function renderCompareSelectors() {
        const options = reports.map((report, index) => `<option value="${escapeHtml(report.traceId)}">${index + 1}. ${escapeHtml(reportName(report))} · ${formatMs(report.totalStartupMs)}</option>`).join('');
        const before = $('compare-before');
        const after = $('compare-after');
        const oldBefore = before.value;
        const oldAfter = after.value;
        before.innerHTML = options;
        after.innerHTML = options;
        before.value = reports.some(item => item.traceId === oldBefore) ? oldBefore : reports[Math.max(0, reports.length - 2)]?.traceId || '';
        after.value = reports.some(item => item.traceId === oldAfter) ? oldAfter : reports.at(-1)?.traceId || '';
        renderComparison();
      }

      function renderComparison() {
        const before = reports.find(report => report.traceId === $('compare-before').value);
        const after = reports.find(report => report.traceId === $('compare-after').value);
        if (!before || !after) {
          $('compare-content').innerHTML = '<p class="muted">至少导入两条日志后进行对比。</p>';
          return;
        }
        const beforeMap = stageMap(before);
        const afterMap = stageMap(after);
        const names = [...new Set([...beforeMap.keys(), ...afterMap.keys()])]
          .sort((a, b) => (afterMap.get(b) || beforeMap.get(b) || 0) - (afterMap.get(a) || beforeMap.get(a) || 0));
        const rows = [{name:'startupTotal', before:before.totalStartupMs, after:after.totalStartupMs}, ...names.map(name => ({name, before:beforeMap.get(name), after:afterMap.get(name)}))];
        const body = rows.map(row => {
          const comparable = Number.isFinite(row.before) && Number.isFinite(row.after) && row.before !== 0;
          const percent = comparable ? (row.after - row.before) / row.before * 100 : null;
          const deltaClass = percent == null || Math.abs(percent) < .05 ? '' : percent < 0 ? 'faster' : 'slower';
          const delta = percent == null ? '—' : `${percent >= 0 ? '+' : ''}${percent.toFixed(1)}%`;
          return `<tr><td>${escapeHtml(stageLabel(row.name))}</td><td>${row.before == null ? '—' : formatMs(row.before)}</td><td>${row.after == null ? '—' : formatMs(row.after)}</td><td class="delta ${deltaClass}">${delta}</td></tr>`;
        }).join('');
        $('compare-content').innerHTML = `<div class="table-wrap"><table><thead><tr><th>阶段</th><th>基准</th><th>对比</th><th>变化</th></tr></thead><tbody>${body}</tbody></table></div>`;
      }

      function render() {
        const hasReports = reports.length > 0;
        $('workspace').hidden = !hasReports;
        $('empty-state').hidden = hasReports;
        if (!hasReports) return;
        renderList();
        renderDetail();
        renderCompareSelectors();
      }

      async function importFiles(files) {
        const imported = [];
        for (const file of files) imported.push(...parseText(await file.text()));
        if (!imported.length) throw new Error('文件中没有找到完整的 JIVE 播放日志。');
        addReports(imported);
      }

      $('file-input').addEventListener('change', async event => {
        $('import-error').textContent = '';
        try { await importFiles([...event.target.files]); }
        catch (error) { $('import-error').textContent = error.message; }
        event.target.value = '';
      });
      $('parse-text').addEventListener('click', () => {
        $('import-error').textContent = '';
        const imported = parseText($('paste-input').value);
        if (!imported.length) { $('import-error').textContent = '没有找到完整日志，请确认所有 CHUNK 分片均已复制。'; return; }
        addReports(imported);
      });
      $('clear-all').addEventListener('click', () => {
        reports = [];
        selectedId = null;
        $('paste-input').value = '';
        $('import-error').textContent = '';
        render();
      });

      const dropZone = $('drop-zone');
      ['dragenter', 'dragover'].forEach(name => dropZone.addEventListener(name, event => { event.preventDefault(); dropZone.classList.add('dragging'); }));
      ['dragleave', 'drop'].forEach(name => dropZone.addEventListener(name, event => { event.preventDefault(); dropZone.classList.remove('dragging'); }));
      dropZone.addEventListener('drop', async event => {
        $('import-error').textContent = '';
        try { await importFiles([...event.dataTransfer.files]); }
        catch (error) { $('import-error').textContent = error.message; }
      });

      document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(item => item.classList.toggle('active', item === tab));
        document.querySelectorAll('.panel').forEach(panel => panel.classList.toggle('active', panel.id === `${tab.dataset.tab}-panel`));
      }));
      $('compare-before').addEventListener('change', renderComparison);
      $('compare-after').addEventListener('change', renderComparison);
      render();
    })();
  </script>
</body>
</html>
